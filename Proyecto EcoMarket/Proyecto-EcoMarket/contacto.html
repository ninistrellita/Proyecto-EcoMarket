<!DOCTYPE html>
<html lang="e">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="CSS/contacto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>
    <header>
        <h1>Informacion de contacto</h1>
    </header>

    <section class="contacto">

        <div class="formulario">
            <h2>Nombre</h2>
            <input type="text" placeholder="Ingrese su nombre">
            <h2>Email</h2>
            <input type="email" placeholder="Ingrese su email">
            <h2>Mensaje</h2>
            <textarea placeholder="Ingrese su mensaje"></textarea>
            <button type="submit">Enviar</button>

        </div>
    </section>

    <section>

        <div class="ubi">

            <h2>Ubicacion</h2>

            <img src="contacto/ubicacion.png">
        </div>
    </section>

    <section>

        <h2>Nuestras redes sociales</h2>

        <div class="redes">
            <i class="fa-brands fa-facebook" style="color: #0247f6;"></i>
            <i class="fa-brands fa-instagram" style="color: #e1306c;"></i>
            <i class="fa-brands fa-github" style="color: #333;"></i>
        </div>

    </section>

    <footer>
        "Compra responsable, vive sostenible"
    </footer>
</body>
</html>
